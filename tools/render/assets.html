<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--
  Renders ONE piece of the prototype's look at a time, so headless Edge can take a
  transparent screenshot of it (tools/render-assets.ps1). The CSS is the same as in
  prototype/index.html. Pick the piece with the URL hash, e.g. assets.html#die3
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  :root {
    --tex: "../../prototype/textures/";
    --metal-photo: url("../../prototype/textures/metal_plate_02_diff_1k.jpg");
    --leather-photo: url("../../prototype/textures/brown_leather_albedo_1k.jpg");
    --wood-dice: url("../../prototype/textures/dark_wood_diff_1k.jpg");
    --felt-photo: url("../../prototype/textures/velour_velvet_diff_1k.jpg");
    --brushed: linear-gradient(180deg, rgba(240,205,145,.78) 0%, rgba(165,122,64,.66) 30%, rgba(88,60,28,.72) 66%, rgba(205,162,95,.7) 100%);
    --brushed-h: linear-gradient(90deg, rgba(240,205,145,.78) 0%, rgba(165,122,64,.66) 30%, rgba(88,60,28,.72) 66%, rgba(205,162,95,.7) 100%);
    --gold: linear-gradient(135deg, #fff1b8 0%, #e0b44c 22%, #8a6418 48%, #f0cf6e 70%, #7a5512 100%);
  }
  .el { position: absolute; left: 0; top: 0; box-sizing: border-box; }

  /* Soft light: brightest in the middle, fading out to nothing (white, tinted in game) */
  .softglow {
    width: 256px; height: 64px;
    background: radial-gradient(ellipse 50% 50% at center,
      rgba(255,255,255,1) 0%, rgba(255,255,255,.75) 22%, rgba(255,255,255,.35) 50%,
      rgba(255,255,255,.10) 78%, rgba(255,255,255,0) 100%);
  }

  /* Die face (no pips): carved wood, worn gold rim, light from the top-left */
  .die {
    width: 64px; height: 64px; border: 3px solid transparent; border-radius: 13px;
    background:
      radial-gradient(circle at 30% 22%, rgba(255,230,190,.3), transparent 55%) padding-box,
      radial-gradient(circle at 72% 85%, rgba(0,0,0,.3), transparent 60%) padding-box,
      var(--wood-dice) padding-box,
      var(--gold) border-box;
    background-size: auto, auto, 240px, auto;
    box-shadow: inset 0 0 0 1px rgba(60,35,10,.55), inset 0 -3px 5px rgba(0,0,0,.35);
  }
  /* Inlaid gold pip */
  .pip {
    left: 1px; top: 1px; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #fff4c4 0 10%, #f0c95a 30%, #b58a2a 62%, #6a4a10 100%);
    box-shadow: inset 0 1px 1.5px rgba(0,0,0,.55), 0 1px 0 rgba(255,225,170,.25), 0 0 0 1px rgba(60,35,5,.45);
  }
  /* Glow around a saved die (the die itself is drawn separately) */
  .glow {
    left: 32px; top: 32px; width: 64px; height: 64px; border-radius: 13px;
    box-shadow: 0 0 0 2px #ffe08a, 0 0 14px 4px rgba(255,205,90,.6);
  }
  /* Buttons: red lacquer / dark leather with a brushed bronze rim */
  .btn {
    border: 3px solid transparent; border-radius: 4px;
    box-shadow: inset 0 1px 0 rgba(255,210,180,.3), inset 0 -3px 5px rgba(0,0,0,.4), 0 0 0 1px #0a0604;
  }
  .btn.primary {
    background:
      linear-gradient(rgba(255,215,195,.2), rgba(255,255,255,0) 48%) padding-box,
      linear-gradient(rgba(150,20,10,.62), rgba(95,10,5,.72)) padding-box,
      var(--leather-photo) padding-box,
      var(--brushed) border-box, var(--metal-photo) border-box;
    background-size: auto, auto, 300px, auto, auto;
  }
  .btn.secondary {
    background:
      linear-gradient(rgba(255,230,200,.12), rgba(255,255,255,0) 48%) padding-box,
      linear-gradient(rgba(16,9,4,.5), rgba(16,9,4,.5)) padding-box,
      var(--leather-photo) padding-box,
      var(--brushed) border-box, var(--metal-photo) border-box;
    background-size: auto, auto, 300px, auto, auto;
    box-shadow: inset 0 0 14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,210,180,.15), 0 0 0 1px #0a0604;
  }
  /* Window frame pieces: bevelled bronze bands and an L-shaped corner plate with a rivet */
  .bandH { width: 256px; height: 6px; background: var(--brushed), var(--metal-photo); background-size: auto, 256px;
    box-shadow: inset 0 1px 0 rgba(255,235,190,.35), inset 0 -1px 0 rgba(0,0,0,.6); }
  .bandV { width: 6px; height: 256px; background: var(--brushed-h), var(--metal-photo); background-size: auto, 256px;
    box-shadow: inset 1px 0 0 rgba(255,235,190,.35), inset -1px 0 0 rgba(0,0,0,.6); }
  /* Rounded outer corner of the window frame (top-left; mirrored in game for the others) */
  .cornerround { width: 6px; height: 6px; border-top-left-radius: 6px;
    background: var(--brushed), var(--metal-photo); background-size: auto, 256px;
    box-shadow: inset 1px 1px 0 rgba(255,235,190,.35); }
  .corner {
    width: 32px; height: 32px;
    background:
      radial-gradient(circle at 7px 7px, #fff0c4 0 1px, #c4a46c 1.6px, #6a5232 3.2px, #2a1d10 4.2px, transparent 4.8px),
      linear-gradient(135deg, rgba(240,205,145,.8), rgba(150,110,58,.7) 45%, rgba(80,55,26,.75) 70%, rgba(200,160,95,.7)),
      var(--metal-photo);
    background-size: auto, auto, 256px;
    clip-path: polygon(0 0, 100% 0, 100% 11px, 11px 11px, 11px 100%, 0 100%);
  }
  /* Saved-dice tray: brushed rim, red felt */
  .tray {
    width: 262px; height: 56px; border: 4px solid transparent; border-radius: 6px;
    background:
      radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.6) 100%) padding-box,
      linear-gradient(rgba(45,4,2,.62), rgba(22,2,1,.72)) padding-box,
      var(--felt-photo) padding-box,
      var(--brushed) border-box, var(--metal-photo) border-box;
    background-size: auto, auto, 260px, auto, auto;
    box-shadow: inset 0 5px 12px rgba(0,0,0,.85);
  }
  /* Title plaque: red lacquer with a metal rim */
  .plaque {
    width: 220px; height: 26px; border: 2px solid transparent; border-radius: 3px;
    background:
      linear-gradient(rgba(255,215,190,.2), transparent 50%) padding-box,
      linear-gradient(rgba(150,20,10,.65), rgba(95,10,5,.75)) padding-box,
      var(--leather-photo) padding-box,
      var(--brushed) border-box, var(--metal-photo) border-box;
    background-size: auto, auto, 260px, auto, auto;
    box-shadow: inset 0 1px 0 rgba(255,210,180,.25), inset 0 -2px 4px rgba(0,0,0,.4);
  }
  /* Fold tab: leather with stitching and a metal rim (rounded on the left) */
  .tab {
    width: 24px; height: 116px; border: 2px solid transparent; border-right: none; border-radius: 8px 0 0 8px;
    background: linear-gradient(rgba(16,9,4,.45), rgba(16,9,4,.45)) padding-box, var(--leather-photo) padding-box,
      var(--brushed) border-box, var(--metal-photo) border-box;
    background-size: auto, 300px, auto, auto;
    box-shadow: inset 0 0 12px rgba(0,0,0,.6);
    outline: 1px dashed rgba(225,195,145,.32); outline-offset: -5px;
  }
  /* Hand-drawn pen stroke for struck-out fields (white, tinted in game) */
  svg.strike { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<script>
  const name = location.hash.slice(1);
  const m = name.match(/^die(\d)$/);
  if (m) {
    const i = +m[1] - 1;
    // The die is drawn smaller (44 of 64 px) in the middle of the canvas, so it can be
    // rotated in game without its corners being cut off.
    const d = document.createElement("div");
    d.className = "el die";
    d.style.backgroundPosition = `0 0, 0 0, ${-i * 53 - 20}px ${-i * 37 - 10}px, 0 0`;
    d.style.left = "10px"; d.style.top = "10px";
    d.style.transformOrigin = "0 0";
    d.style.transform = "scale(0.6875)";
    document.body.appendChild(d);
  } else if (name.startsWith("btn-")) {
    // btn-primary-170x44
    const [, kind, size] = name.split("-");
    const [w, h] = size.split("x").map(Number);
    const b = document.createElement("div");
    b.className = "el btn " + kind;
    b.style.width = w + "px"; b.style.height = h + "px";
    document.body.appendChild(b);
  } else if (name === "icon-yatzy") {
    // Game icon for Yatzy: two of our dice, one tilted behind the other (in a 64x64 canvas)
    const die = (x, y, rot, scale, pips, bg) => {
      const d = document.createElement("div");
      d.className = "el die";
      d.style.cssText += `left:${x}px;top:${y}px;transform-origin:32px 32px;transform:rotate(${rot}deg) scale(${scale});background-position:0 0,0 0,${bg},0 0`;
      for (const [px, py] of pips) {
        const p = document.createElement("div");
        p.className = "el pip";
        p.style.left = (px - 7) + "px"; p.style.top = (py - 7) + "px";
        d.appendChild(p);
      }
      document.body.appendChild(d);
    };
    die(8, -9, 16, 0.5, [[17, 17], [41, 41], [29, 29]], "-60px -40px");
    die(-9, 5, -8, 0.6, [[16, 16], [42, 16], [29, 29], [16, 42], [42, 42]], "-130px -90px");
  } else if (name === "icon-minimap") {
    // Minimap button: two of our dice side by side, slightly turned the way they'd land
    // (64x64 canvas, drawn at 2x; shown at about 20 px, so the dice fill the canvas)
    const die = (x, y, rot, scale, pips, bg) => {
      const d = document.createElement("div");
      d.className = "el die";
      d.style.cssText += `left:${x}px;top:${y}px;transform-origin:32px 32px;transform:rotate(${rot}deg) scale(${scale});background-position:0 0,0 0,${bg},0 0;
        box-shadow: inset 0 0 0 1px rgba(60,35,10,.55), inset 0 -3px 5px rgba(0,0,0,.35), 0 4px 6px rgba(0,0,0,.6);`;
      for (const [px, py] of pips) {
        const p = document.createElement("div");
        p.className = "el pip";
        p.style.cssText += `left:${px - 8}px;top:${py - 8}px;width:16px;height:16px;`;
        d.appendChild(p);
      }
      document.body.appendChild(d);
    };
    // Drawn as clean shapes (not the photo-textured dice): at ~20 px only big, high-contrast
    // pips stay readable. Ivory dice with dark pips and a dark outline, the right one turned.
    const svgDie = (x, y, rot, pips) => `
      <g transform="translate(${x} ${y}) rotate(${rot} 7 7)">
        <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#iv)" stroke="#1d1207" stroke-width="1.3"/>
        ${pips.map(([px, py]) => `<circle cx="${px}" cy="${py}" r="1.7" fill="#2a1608"/>`).join("")}
      </g>`;
    document.body.innerHTML = `<svg width="64" height="64" viewBox="0 0 32 32" style="position:absolute;left:0;top:0">
      <defs><linearGradient id="iv" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff8e6"/><stop offset=".6" stop-color="#ecdcb6"/><stop offset="1" stop-color="#bfa577"/></linearGradient></defs>
      ${svgDie(1.6, 9.5, -12, [[3.8, 3.8], [7, 7], [10.2, 10.2]])}
      ${svgDie(16.2, 8.2, 14, [[3.8, 3.8], [10.2, 3.8], [7, 7], [3.8, 10.2], [10.2, 10.2]])}
    </svg>`;
  } else if (name === "icon-checker") {
    // Game icon for backgammon: a stack of two checkers (dark red lacquer + ivory) with gold rims
    const disc = (x, y, face, rim) => {
      const d = document.createElement("div");
      d.className = "el";
      d.style.cssText = `left:${x}px;top:${y}px;width:44px;height:44px;border-radius:50%;border:3px solid transparent;
        background: radial-gradient(circle at 50% 50%, transparent 0 9px, rgba(0,0,0,.35) 9.5px 10.5px, transparent 11px 15px,
                      rgba(0,0,0,.25) 15.5px 16.5px, transparent 17px) padding-box,
                    radial-gradient(circle at 32% 28%, rgba(255,255,255,.35), transparent 55%) padding-box,
                    ${face} padding-box, ${rim} border-box;
        box-shadow: 0 3px 4px rgba(0,0,0,.55), inset 0 -3px 5px rgba(0,0,0,.35);`;
      document.body.appendChild(d);
    };
    disc(16, 4, "radial-gradient(circle at 40% 35%, #f6ead0, #cdb88e 70%, #9c8762)", "var(--gold)");
    disc(4, 16, "radial-gradient(circle at 40% 35%, #a3281c, #6e140c 70%, #3e0905)", "var(--gold)");
  } else if (name === "checker-red" || name === "checker-ivory") {
    // Backgammon checker seen from above: lacquered wood with turned rings and a gold rim
    // (52 px in a 64 px canvas, room for the soft shadow). Drawn at 2x.
    const red = name === "checker-red";
    const face = red
      ? "radial-gradient(circle at 40% 35%, rgba(170,45,30,.55), rgba(110,20,12,.75) 70%, rgba(60,10,5,.9)), var(--wood-dice)"
      : "radial-gradient(circle at 40% 35%, rgba(250,238,212,.88), rgba(214,192,148,.82) 70%, rgba(160,136,96,.9)), var(--wood-dice)";
    const d = document.createElement("div");
    d.className = "el";
    d.style.cssText = `left:6px;top:5px;width:52px;height:52px;border-radius:50%;border:3px solid transparent;
      background: radial-gradient(circle at 50% 50%, transparent 0 9px, rgba(0,0,0,.30) 9.5px 10.5px, transparent 11px 16px,
                    rgba(0,0,0,.22) 16.5px 17.5px, transparent 18px) padding-box,
                  radial-gradient(circle at 32% 28%, rgba(255,255,255,${red ? .28 : .4}), transparent 55%) padding-box,
                  ${face.split("), var").join(") padding-box, var")} padding-box,
                  var(--gold) border-box;
      background-size: auto, auto, auto, ${red ? "180px" : "220px"}, auto;
      background-position: 0 0, 0 0, 0 0, ${red ? "-40px -70px" : "-120px -30px"}, 0 0;
      box-shadow: 0 2px 3px rgba(0,0,0,.6), inset 0 -3px 5px rgba(0,0,0,.35);`;
    document.body.appendChild(d);
  } else if (name === "point-red" || name === "point-ivory") {
    // A backgammon point: a long triangle, red lacquered leather or pale bone-coloured leather,
    // with a thin dark edge. 32x128 in the canvas, drawn at 2x; the tip is at the bottom.
    const red = name === "point-red";
    const edge = document.createElement("div");
    edge.className = "el";
    edge.style.cssText = `width:32px;height:128px;background:#140a04;clip-path:polygon(0 0,100% 0,50% 100%);`;
    document.body.appendChild(edge);
    const d = document.createElement("div");
    d.className = "el";
    d.style.cssText = `left:1.2px;top:0;width:29.6px;height:125px;clip-path:polygon(0 0,100% 0,50% 100%);
      background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.06) 50%, rgba(0,0,0,.28)),
                  linear-gradient(${red ? "rgba(150,22,12,.66), rgba(92,10,5,.76)" : "rgba(236,214,170,.80), rgba(184,156,110,.84)"}),
                  var(--leather-photo);
      background-size: auto, auto, 200px;
      background-position: 0 0, 0 0, ${red ? "-30px -60px" : "-90px -10px"};`;
    document.body.appendChild(d);
  } else if (name === "portrait-ring" || name === "portrait-back") {
    // Round picture frame (like WoW's player frame, our own art): a worn gold ring with a
    // shaded bevel and a dark rim inside; "back" = the dark leather disc behind the picture.
    const d = document.createElement("div");
    d.className = "el";
    if (name === "portrait-ring") {
      d.style.cssText = `left:2px;top:2px;width:60px;height:60px;border-radius:50%;border:5px solid transparent;
        background: var(--gold) border-box;
        -webkit-mask: linear-gradient(#000 0 0) border-box, linear-gradient(#000 0 0) padding-box;
        -webkit-mask-composite: xor; mask-composite: exclude;
        box-shadow: 0 2px 4px rgba(0,0,0,.7), inset 0 0 0 1px rgba(60,35,5,.6);`;
      const inner = document.createElement("div");
      inner.className = "el";
      inner.style.cssText = `left:6px;top:6px;width:52px;height:52px;border-radius:50%;
        box-shadow: inset 0 2px 5px rgba(0,0,0,.75), 0 0 0 1px rgba(30,15,3,.8);`;
      document.body.appendChild(inner);
    } else {
      d.style.cssText = `left:4px;top:4px;width:56px;height:56px;border-radius:50%;
        background: radial-gradient(circle at 40% 35%, rgba(70,50,38,.6), rgba(12,8,5,.92) 75%), var(--leather-photo);
        background-size: auto, 200px;`;
    }
    document.body.appendChild(d);
  } else if (name === "rays") {
    // Golden light rays for the YATZY! celebration (rotated in game)
    const d = document.createElement("div");
    d.className = "el";
    d.style.cssText = `width:256px;height:256px;border-radius:50%;
      background: repeating-conic-gradient(rgba(255,215,100,.55) 0 7deg, transparent 7deg 20deg);
      -webkit-mask: radial-gradient(circle, #000 12%, rgba(0,0,0,.6) 35%, transparent 68%);
      mask: radial-gradient(circle, #000 12%, rgba(0,0,0,.6) 35%, transparent 68%);`;
    document.body.appendChild(d);
  } else if (name === "home") {
    // House icon, same bronze style as the bin
    document.body.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" style="position:absolute;left:0;top:0">
      <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f2dca0"/><stop offset=".45" stop-color="#b08a4e"/><stop offset="1" stop-color="#5e4524"/></linearGradient></defs>
      <path d="M8 1.6 L15 7.6 L13.2 7.6 L13.2 14.6 L9.8 14.6 L9.8 10.4 L6.2 10.4 L6.2 14.6 L2.8 14.6 L2.8 7.6 L1 7.6 Z"
        fill="url(#b)" stroke="#1a1006" stroke-width=".9" stroke-linejoin="round"/></svg>`;
  } else if (name === "undo") {
    // Undo icon: a circular arrow turning back (counter-clockwise), same bronze as the bin
    document.body.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" style="position:absolute;left:0;top:0">
      <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f2dca0"/><stop offset=".45" stop-color="#b08a4e"/><stop offset="1" stop-color="#5e4524"/></linearGradient></defs>
      <path d="M11.9 12 A5.2 5.2 0 1 0 2.8 8.6" fill="none" stroke="#1a1006" stroke-width="3.4" stroke-linecap="butt"/>
      <path d="M11.9 12 A5.2 5.2 0 1 0 2.8 8.6" fill="none" stroke="url(#b)" stroke-width="2" stroke-linecap="butt"/>
      <path d="M-0.2 8.3 L5.8 8.3 L2.8 12.6 Z" fill="url(#b)" stroke="#1a1006" stroke-width=".9" stroke-linejoin="round"/></svg>`;
  } else if (name === "check") {
    // Big check mark: the same bronze, with a dark outline
    document.body.innerHTML = `<svg width="32" height="32" viewBox="0 0 16 16" style="position:absolute;left:0;top:0">
      <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f6e4aa"/><stop offset=".45" stop-color="#c29a58"/><stop offset="1" stop-color="#6a4e28"/></linearGradient></defs>
      <path d="M2.6 8.4 L6.3 12 L13.4 3.8" fill="none" stroke="#1a1006" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2.6 8.4 L6.3 12 L13.4 3.8" fill="none" stroke="url(#b)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  } else if (name === "gear") {
    // Settings: a cog wheel with 8 teeth and a hole, same bronze as the bin
    const pts = [], teeth = 8, ro = 7.4, ri = 5.6, cx = 8, cy = 8;
    for (let i = 0; i < teeth; i++) {
      const a = i * 2 * Math.PI / teeth, w = Math.PI / teeth;
      const p = (ang, r) => `${(cx + Math.cos(ang) * r).toFixed(2)} ${(cy + Math.sin(ang) * r).toFixed(2)}`;
      pts.push(p(a - w * 0.95, ri), p(a - w * 0.45, ro), p(a + w * 0.45, ro), p(a + w * 0.95, ri));
    }
    const hole = `M${cx + 2.3} ${cy} A2.3 2.3 0 1 0 ${cx - 2.3} ${cy} A2.3 2.3 0 1 0 ${cx + 2.3} ${cy} Z`;
    document.body.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" style="position:absolute;left:0;top:0">
      <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f2dca0"/><stop offset=".45" stop-color="#b08a4e"/><stop offset="1" stop-color="#5e4524"/></linearGradient></defs>
      <path d="M${pts.join(" L")} Z ${hole}" fill="url(#b)" fill-rule="evenodd" stroke="#1a1006" stroke-width=".9" stroke-linejoin="round"/></svg>`;
  } else if (name.startsWith("speaker")) {
    // Sound: a speaker with 0-3 sound waves; "speaker-off" is crossed out
    const level = name === "speaker-off" ? 0 : Number(name.slice(-1));
    // A big speaker (about as tall as the cog) with smaller waves beside it; the dark outline
    // between the waves keeps 1, 2 and 3 apart at small sizes.
    const waves = [[9.5, 1.9], [11.6, 3.3], [13.7, 4.7]].slice(0, level).map(([x, h]) => {
      const d = `M${x} ${8 - h} Q${x + h * 0.45} 8 ${x} ${8 + h}`;
      return `<path d="${d}" fill="none" stroke="#1a1006" stroke-width="2.1" stroke-linecap="round"/>
              <path d="${d}" fill="none" stroke="#e6c987" stroke-width="1.25" stroke-linecap="round"/>`;
    }).join("");
    const cross = level === 0 ? `
      <path d="M10 5.2 L14.8 10.8 M14.8 5.2 L10 10.8" fill="none" stroke="#1a1006" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M10 5.2 L14.8 10.8 M14.8 5.2 L10 10.8" fill="none" stroke="#d0432e" stroke-width="1.5" stroke-linecap="round"/>` : "";
    document.body.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" style="position:absolute;left:0;top:0">
      <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f2dca0"/><stop offset=".45" stop-color="#b08a4e"/><stop offset="1" stop-color="#5e4524"/></linearGradient></defs>
      <path d="M0.5 4.9 L3.4 4.9 L7.8 1.2 L7.8 14.8 L3.4 11.1 L0.5 11.1 Z" fill="url(#b)" stroke="#1a1006" stroke-width=".9" stroke-linejoin="round"/>
      ${waves}${cross}</svg>`;
  } else if (name === "trash") {
    // Bin icon: aged bronze with a dark outline, light from the top-left
    document.body.innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" style="position:absolute;left:0;top:0">
      <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f2dca0"/><stop offset=".45" stop-color="#b08a4e"/><stop offset="1" stop-color="#5e4524"/></linearGradient></defs>
      <g stroke="#1a1006" stroke-width=".9" stroke-linejoin="round">
        <rect x="5.6" y="1.2" width="4.8" height="1.8" rx=".6" fill="url(#b)"/>
        <rect x="2.2" y="2.8" width="11.6" height="2.1" rx=".7" fill="url(#b)"/>
        <path d="M3.4 5.1 L4.3 14.4 Q4.4 15 5 15 L11 15 Q11.6 15 11.7 14.4 L12.6 5.1 Z" fill="url(#b)"/>
      </g>
      <g stroke="#3a2610" stroke-width=".9" stroke-linecap="round" opacity=".85">
        <path d="M6.2 7 L6.4 13"/><path d="M8 7 L8 13"/><path d="M9.8 7 L9.6 13"/>
      </g></svg>`;
  } else if (name === "strike") {
    document.body.innerHTML = `<svg class="strike" width="64" height="8" viewBox="0 0 64 8">
      <path d="M3 5.6 C 18 4.6, 34 3.6, 61 2.2" stroke="white" stroke-width="2.8" stroke-linecap="round" fill="none"/></svg>`;
  } else {
    const d = document.createElement("div");
    d.className = "el " + name;
    document.body.appendChild(d);
  }
</script>
