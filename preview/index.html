<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yatzy – förhandsvisning</title>
<style>
  :root { --bg: #15130f; --panel: #1f1b15; --line: #3a3226; --text: #eadfc6; --muted: #a39679; --gold: #e9c46a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  body { display: flex; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; min-width: 0; position: relative; }
  #frame { position: relative; box-shadow: 0 0 0 1px #000, 0 8px 30px rgba(0,0,0,.6); }
  #screen { width: 100%; height: 100%; display: block; outline: none; cursor: default; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 16px; }
  #chat { position: absolute; left: 1.2%; bottom: 2%; width: 34%; pointer-events: none; }
  #chatlines { max-height: 9.5em; overflow: hidden; font: 600 12px/1.35 Arial, sans-serif; text-shadow: 1px 1px 1px #000, 0 0 2px #000; }
  #chatinput { pointer-events: auto; width: 100%; margin-top: 3px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.25);
               color: #fff; font: 12px Arial, sans-serif; padding: 3px 5px; opacity: .55; }
  #chatinput:focus { opacity: 1; outline: none; }
  #notice { position: absolute; left: 0; right: 0; top: 22%; text-align: center; pointer-events: none; }
  .notice { font: 700 26px Georgia, serif; text-shadow: 2px 2px 2px #000; transition: opacity 1.4s; }
  .notice.fade { opacity: 0; }

  aside { width: 300px; flex: none; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px 14px 20px; }
  h1 { font: 700 15px Georgia, serif; color: var(--gold); margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  .member { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; background: #19160f; }
  .member.viewing { border-color: var(--gold); }
  .member.offline .name { color: var(--muted); }
  .mtop { display: flex; justify-content: space-between; gap: 6px; }
  .name { font-weight: 600; } .name em { color: var(--gold); font-style: normal; font-weight: 400; }
  .meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .mctl { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 4px; font-size: 12px; }
  .tag { color: var(--muted); font-size: 11px; }
  button, select { background: #2c261c; color: var(--text); border: 1px solid #4a3f2e; border-radius: 4px; padding: 3px 8px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--gold); }
  button:disabled { opacity: .5; cursor: default; }
  label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .rows label { display: flex; margin: 3px 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  #errbox { margin-top: 12px; }
  #errors pre { white-space: pre-wrap; word-break: break-word; background: #2a1210; color: #ffb4a8; border: 1px solid #6b2a22;
                padding: 6px; font-size: 11px; border-radius: 4px; margin: 6px 0; max-height: 220px; overflow: auto; }
  input[type=range] { width: 150px; }
  @media (max-width: 900px) {
    body { flex-direction: column; height: auto; }
    #stage { height: 62vh; flex: none; }
    aside { width: auto; border-left: none; border-top: 1px solid var(--line); }
  }
  body.native #stage { overflow: auto; align-items: flex-start; justify-content: flex-start; padding: 0; }
  body.native #frame { flex: none; }
  body.native aside { display: none; }
</style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <canvas id="screen" width="1366" height="768" tabindex="0"></canvas>
      <div id="notice"></div>
      <div id="chat"><div id="chatlines"></div><input id="chatinput" placeholder="Enter = chatt, t.ex. /yatzy" autocomplete="off"></div>
      <div id="loading">Laddar…</div>
    </div>
  </div>
  <aside>
    <h1>Yatzy – förhandsvisning</h1>
    <div class="sub">Addonets riktiga kod i en låtsas-WoW. Utseendet är nära men inte exakt som i spelet.</div>

    <h2>Guilden</h2>
    <div id="members"></div>
    <div class="hint">"Se som" visar addonet som den spelaren ser det. Du kan spela åt dem också (stäng då av "Spelar själv").</div>

    <h2>Addonet</h2>
    <div class="btns">
      <button id="btn-toggle">Öppna/stäng (/yatzy)</button>
      <button id="btn-reload">/reload</button>
      <button id="btn-reset">Nollställ allt</button>
    </div>

    <h2>Din karaktär</h2>
    <div class="rows">
      <label><input type="checkbox" id="moving"> Springer</label>
      <label><input type="checkbox" id="combat"> I strid</label>
      <label><input type="checkbox" id="taxi"> På flygrutt</label>
      <label title="WoW ger 'hemliga' värden i strid – testar att addonet klarar det"><input type="checkbox" id="secrets" checked> Hemliga värden i strid</label>
    </div>

    <h2>Skärm</h2>
    <div class="rows">
      <label>Upplösning
        <select id="res">
          <option value="1920x1080">1920 × 1080</option>
          <option value="1366x768" selected>1366 × 768</option>
          <option value="1280x720">1280 × 720</option>
          <option value="1024x768">1024 × 768</option>
          <option value="2560x1440">2560 × 1440</option>
        </select>
      </label>
      <label>UI-skala <input type="range" id="uiscale" min="0.64" max="1.15" step="0.01" value="1"> <span id="uiscaleval">100%</span></label>
      <label><input type="checkbox" id="mute" checked> Stäng av ljudet i förhandsvisningen</label>
      <label>Ljudvolym <input type="range" id="volume" min="0" max="1" step="0.05" value="0.5"></label>
    </div>

    <div id="errbox" hidden>
      <h2>Lua-fel (<span id="errcount">0</span>) <button id="btn-clearerr" style="float:right;padding:0 6px">Rensa</button></h2>
      <div id="errors"></div>
    </div>
  </aside>
  <script src="vendor/fengari-web.js"></script>
  <script src="host.js"></script>
</body>
</html>
